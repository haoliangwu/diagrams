<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek context caching — input cache hit rules</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 60ch;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DeepSeek · Context Caching</p>
    <h1>Input cache hit rules — state evolution across rounds</h1>
    <p class="subtitle">Each request either fully matches a cached prefix unit (HIT, accent) or persists a new common-prefix unit. Two examples trace one state machine.</p>

    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kvcache-title kvcache-desc">
      <title id="kvcache-title">DeepSeek context caching — input cache hit rules as state evolution</title>
      <desc id="kvcache-desc">State machine showing how DeepSeek's input cache evolves across request rounds: an empty cache receives a prefix unit, then a second request either fully matches an existing unit (cache hit, accent arrow) or persists a new common-prefix unit; a third request can then hit the shorter unit.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Transitions (drawn first, behind nodes) ===== -->

      <!-- Start dot → S0 -->
      <line x1="480" y1="62" x2="480" y2="80" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- S0 → S1 : req A+B / persist A+B (vertical) -->
      <line x1="480" y1="144" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- S1 → S2 : req A+B+C / HIT (orthogonal elbow, down-left) -->
      <path d="M 448 272 V 324 a 8 8 0 0 1 -8 8 H 228 a 8 8 0 0 0 -8 8 V 360"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- S1 → S3 : req A+C / persist A (orthogonal elbow, down-right) -->
      <path d="M 512 272 V 324 a 8 8 0 0 0 8 8 H 732 a 8 8 0 0 1 8 8 V 360"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- S3 → S4 : req A+D / HIT (vertical) -->
      <line x1="740" y1="440" x2="740" y2="500" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ===== Transition labels (mask + text, 6-10px gap to stroke) ===== -->

      <!-- S0 → S1 label (right of vertical segment) -->
      <rect x="488" y="164" width="80" height="24" rx="2" fill="#f5f5f5"/>
      <text x="492" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">req A+B</text>
      <text x="492" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">persist A+B</text>

      <!-- S1 → S2 label (above horizontal segment y=332, accent) -->
      <rect x="286" y="300" width="100" height="24" rx="2" fill="#f5f5f5"/>
      <text x="336" y="312" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">req A+B+C · HIT</text>
      <text x="336" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">persist A+B+C</text>

      <!-- S1 → S3 label (above horizontal segment y=332) -->
      <rect x="572" y="300" width="108" height="24" rx="2" fill="#f5f5f5"/>
      <text x="626" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">req A+C · persist A</text>
      <text x="626" y="322" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">no full match</text>

      <!-- S3 → S4 label (right of vertical segment, accent) -->
      <rect x="748" y="460" width="84" height="24" rx="2" fill="#f5f5f5"/>
      <text x="752" y="472" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">req A+D · HIT</text>
      <text x="752" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">persist A+D</text>

      <!-- ===== Annotation callouts (italic Instrument Serif, 2 max) ===== -->

      <text x="40" y="404" fill="#7a8399" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Example 1 · full hit</text>
      <text x="920" y="404" fill="#7a8399" font-size="14" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="end">Example 2 · partial → hit</text>

      <!-- ===== Start dot ===== -->
      <circle cx="480" cy="56" r="6" fill="#2d3142"/>

      <!-- ===== State nodes (drawn last) ===== -->

      <!-- S0 — No cache -->
      <rect x="400" y="80" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="88" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="428" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="480" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No cache</text>
      <text x="480" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache: ∅</text>

      <!-- S1 — Prefix unit stored -->
      <rect x="400" y="208" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="216" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="428" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="480" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prefix unit stored</text>
      <text x="480" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache: {A+B}</text>

      <!-- S2 — Prefix extended (hit) -->
      <rect x="120" y="360" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="368" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="148" y="377" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="220" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prefix extended</text>
      <text x="220" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache: {A+B, A+B+C}</text>
      <text x="220" y="426" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">round 2 · reused A+B</text>

      <!-- S3 — Common prefix persisted -->
      <rect x="640" y="360" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="368" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="668" y="377" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="740" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Common prefix persisted</text>
      <text x="740" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache: {A, A+B}</text>
      <text x="740" y="426" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">round 2 · A extracted</text>

      <!-- S4 — Prefix extended (hit) -->
      <rect x="640" y="500" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="508" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="668" y="517" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="740" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prefix extended</text>
      <text x="740" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache: {A, A+B, A+D}</text>
      <text x="740" y="566" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">round 3 · reused A</text>

      <!-- ===== Legend (horizontal bottom strip) ===== -->
      <line x1="30" y1="600" x2="930" y2="600" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="30" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="110" y1="620" x2="138" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="146" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">no match / partial — persist new unit</text>

      <line x1="470" y1="620" x2="498" y2="620" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="506" y="624" fill="#eb6c36" font-size="9" font-family="'Geist', sans-serif">full match — HIT, reuse cached prefix</text>

      <text x="920" y="624" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">src: api-docs.deepseek.com/guides/kv_cache</text>
    </svg>
  </div>
</body>
</html>
