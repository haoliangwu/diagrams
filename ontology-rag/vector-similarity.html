<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相似 ≠ 正确：向量检索的相似度轴</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ONTOLOGY × RAG &nbsp;·&nbsp; VECTOR RETRIEVAL</p>
    <h1>相似，不等于正确</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vecgap-title vecgap-desc">
      <title id="vecgap-title">相似度轴：与问题更相似的段落 A 并不是正确答案</title>
      <desc id="vecgap-desc">用户问题"这个商品可以通过信用卡购买吗？"在顶部，下方一条与问题的余弦相似度轴：段落 A 相似度 0.772 更靠近问题，被检索优先命中，但它不是答案；段落 B 相似度 0.410 更远，答案其实在这里。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 问题节点（顶部） ===== -->
      <rect x="280" y="44" width="400" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="480" y="70" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">USER QUERY</text>
      <text x="480" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">这个商品可以通过信用卡购买吗？</text>

      <!-- ===== 相似度轴 ===== -->
      <!-- 轴基准线 -->
      <line x1="120" y1="232" x2="840" y2="232" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <!-- 刻度线 + 标签（0 / 0.2 / 0.4 / 0.6 / 0.8） -->
      <line x1="120" y1="228" x2="120" y2="236" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="120" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
      <line x1="264" y1="228" x2="264" y2="236" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="264" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.2</text>
      <line x1="408" y1="228" x2="408" y2="236" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="408" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.4</text>
      <line x1="552" y1="228" x2="552" y2="236" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="552" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.6</text>
      <line x1="696" y1="228" x2="696" y2="236" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="696" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.8</text>
      <!-- 轴标题 -->
      <text x="480" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">与问题的余弦相似度</text>

      <!-- ===== 段落 A（0.772，检索命中但错） ===== -->
      <!-- 轴上的锚点 + 虚线 -->
      <line x1="816" y1="240" x2="816" y2="280" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="816" cy="232" r="5" fill="#eb6c36" stroke="#2d3142" stroke-width="1"/>
      <!-- 卡片 -->
      <rect x="716" y="280" width="200" height="88" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="816" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">段落 A</text>
      <text x="816" y="326" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SIMILARITY 0.772</text>
      <text x="816" y="352" fill="#eb6c36" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">检索会命中这里</text>

      <!-- ===== 段落 B（0.410，答案其实在这） ===== -->
      <!-- 轴上的锚点 + 虚线 -->
      <line x1="488" y1="240" x2="488" y2="280" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="488" cy="232" r="5" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/>
      <!-- 卡片 -->
      <rect x="388" y="280" width="200" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="488" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">段落 B</text>
      <text x="488" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SIMILARITY 0.410</text>
      <text x="488" y="352" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">答案其实在这</text>

      <!-- ===== 底部结论 ===== -->
      <line x1="120" y1="420" x2="840" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="480" y="448" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">相似度排序 ≠ 答案正确性 · 越相近，反而越可能南辕北辙</text>

    </svg>
  </div>
</body>
</html>
