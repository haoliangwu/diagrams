<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本体校验管线：从合同文本到 safe_to_act</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ONTOLOGY × RAG &nbsp;·&nbsp; SHACL GUARDRAIL</p>
    <h1>入口加一道确定性闸门</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipe-title pipe-desc">
      <title id="pipe-title">本体校验管线：从合同文本到 safe_to_act</title>
      <desc id="pipe-desc">一条顺序管线：合同文本 Document 经 ContractSegmenter 切分条款，Extractor 用 LLM 把条款抽成结构化 JSON，RDF Builder 转成类型化三元组，SHACL Validator 用预定义形状校验，最终输出 safe_to_act（能否行动）与违规清单。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 主链箭头（先画，后画节点） ===== -->
      <line x1="168" y1="280" x2="190" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="318" y1="280" x2="340" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="468" y1="280" x2="490" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="618" y1="280" x2="640" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="768" y1="280" x2="790" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===== 节点 1：Document（输入） ===== -->
      <rect x="40" y="232" width="128" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="104" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INPUT</text>
      <text x="104" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Document</text>
      <text x="104" y="304" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">合同文本</text>

      <!-- ===== 节点 2：Segmenter ===== -->
      <rect x="190" y="232" width="128" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="254" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">STEP 01</text>
      <text x="254" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Segmenter</text>
      <text x="254" y="304" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">定位条款边界</text>

      <!-- ===== 节点 3：Extractor ===== -->
      <rect x="340" y="232" width="128" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="404" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">STEP 02</text>
      <text x="404" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Extractor · LLM</text>
      <text x="404" y="304" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">条款 → 结构化 JSON</text>

      <!-- ===== 节点 4：RDF Builder ===== -->
      <rect x="490" y="232" width="128" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="554" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">STEP 03</text>
      <text x="554" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">RDF Builder</text>
      <text x="554" y="304" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">JSON → 三元组</text>

      <!-- ===== 节点 5：SHACL Validator ===== -->
      <rect x="640" y="232" width="128" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="704" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">STEP 04</text>
      <text x="704" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">SHACL Validator</text>
      <text x="704" y="304" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">按预定义形状校验</text>

      <!-- ===== 节点 6：safe_to_act（焦点） ===== -->
      <rect x="790" y="232" width="128" height="96" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="854" y="254" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OUTPUT</text>
      <text x="854" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">safe_to_act</text>
      <text x="854" y="304" fill="#eb6c36" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">能否行动 · 违规清单</text>

      <!-- ===== 底部说明 ===== -->
      <line x1="120" y1="420" x2="840" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="480" y="452" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">整条管线的语义来自 Extractor 的一次抽取：RDF Builder 与 SHACL Validator 消费的是同一份 JSON，没有第二次抽取</text>

    </svg>
  </div>
</body>
</html>
