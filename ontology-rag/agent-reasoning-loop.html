<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反馈驱动的推理循环</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ONTOLOGY × RAG &nbsp;·&nbsp; FEEDBACK LOOP</p>
    <h1>别教它答案，让反馈推着它去找</h1>

    <svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
      <title id="loop-title">反馈驱动的推理循环</title>
      <desc id="loop-desc">五个环节组成的顺时针循环：生成回答、校验层拦截（焦点）、负反馈（如"拒绝，3 期最低 100 元"）、推理修正、重新生成；每一步都把结果写回中心的"约束与边界"共享记录，错误信号逐轮累积，Agent 在边界内越改越准。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 环向箭头（圆弧，顺时针，先画；圆心 (520,320)，R=240） ===== -->
      <!-- k0 生成回答 → k1 校验层 -->
      <path d="M 600 93.7 A 240 240 0 0 1 733.8 211.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- k1 校验层 → k2 负反馈 -->
      <path d="M 755.9 276 A 240 240 0 0 1 696.0 483.2" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- k2 负反馈 → k3 推理修正 -->
      <path d="M 594.9 548 A 240 240 0 0 1 446.4 548.4" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- k3 推理修正 → k4 重新生成 -->
      <path d="M 344.8 484 A 240 240 0 0 1 283.7 278.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- k4 重新生成 → k0 生成回答（闭环） -->
      <path d="M 305.7 212 A 240 240 0 0 1 438.3 94.3" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== 写回虚线（站 → 中心 hub） ===== -->
      <line x1="520" y1="112" x2="520" y2="262" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="668" y1="270" x2="625.7" y2="285.7" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="636.7" y1="484" x2="561.3" y2="376.9" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="403.3" y1="484" x2="478.7" y2="376.9" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="372" y1="270" x2="414.3" y2="285.7" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- ===== 站 k0 生成回答（顶部，文字垂直居中） ===== -->
      <rect x="440" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">生成回答</text>
      <text x="520" y="92" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">AI 试答"可以分期"</text>

      <!-- ===== 站 k1 校验层拦截（焦点，右上，文字垂直居中） ===== -->
      <rect x="668" y="212" width="160" height="64" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="748" y="232" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">校验层拦截</text>
      <text x="748" y="256" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">触碰边界了？</text>

      <!-- ===== 站 k2 负反馈（右下，文字垂直居中） ===== -->
      <rect x="580" y="484" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">负反馈</text>
      <text x="660" y="528" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">"拒绝：3 期最低 100 元"</text>

      <!-- ===== 站 k3 推理修正（左下，文字垂直居中） ===== -->
      <rect x="300" y="484" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">推理修正</text>
      <text x="380" y="528" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">在边界内重想</text>

      <!-- ===== 站 k4 重新生成（左侧，文字垂直居中） ===== -->
      <rect x="212" y="212" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">重新生成</text>
      <text x="292" y="256" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">收敛到不再违规</text>

      <!-- ===== Hub：约束与边界（唯一深色元素） ===== -->
      <rect x="420" y="268" width="200" height="104" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="310" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">约束与边界</text>
      <text x="520" y="330" fill="#bfc0c0" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">错误信号逐轮写回</text>

      <!-- ===== 图例（底部） ===== -->
      <line x1="160" y1="580" x2="880" y2="580" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <path d="M 200 596 L 240 596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="256" y="600" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">环：生成 → 校验 → 反馈 → 修正</text>
      <line x1="456" y1="598" x2="496" y2="598" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="512" y="600" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">虚线：把本轮结果写回边界</text>
      <rect x="680" y="590" width="16" height="8" fill="#2d3142"/>
      <text x="708" y="600" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">中心：共享边界记录</text>

    </svg>
  </div>
</body>
</html>
