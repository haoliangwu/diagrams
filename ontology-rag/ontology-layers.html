<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>从本体论到规则的四个层次</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ONTOLOGY × RAG &nbsp;·&nbsp; LAYER STACK</p>
    <h1>抽象往下落，每一层各管一段</h1>

    <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="owlstack-title owlstack-desc">
      <title id="owlstack-title">从本体论到 SHACL 的四个层次</title>
      <desc id="owlstack-desc">四个纵向层次，自下而上互相支撑：最上层本体论（概念层：类、实例、关系、约束、公理）由 OWL 本体（结构层：owl:Class、subClassOf、对象与数据属性）表达，OWL 以 RDF 三元组（数据层：主语-谓语-宾语）存储，RDF 被 SHACL 形状（规则层：NodeShape、targetClass、maxInclusive 等约束）校验。</desc>
      <defs>
        <marker id="arrow-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 6, 8 3, 0 0" fill="#4f5d75"/></marker>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 层间箭头（自下而上：下层支撑上层） ===== -->
      <!-- L2→L1 表达为 -->
      <line x1="468" y1="196" x2="468" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-up)"/>
      <text x="484" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">表达为</text>
      <!-- L3→L2 存储为 -->
      <line x1="468" y1="328" x2="468" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-up)"/>
      <text x="484" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">存储为</text>
      <!-- L4→L3 约束为 -->
      <line x1="468" y1="460" x2="468" y2="424" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-up)"/>
      <text x="484" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">约束为</text>

      <!-- ===== L1 本体论（概念层） ===== -->
      <rect x="80" y="64" width="800" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">本体论</text>
      <text x="852" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">CONCEPT · 概念层</text>
      <!-- chips -->
      <rect x="100" y="112" width="84" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="142" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">class / subclass</text>
      <rect x="196" y="112" width="56" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="224" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">instance</text>
      <rect x="264" y="112" width="56" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="292" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">relation</text>
      <rect x="332" y="112" width="64" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="364" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">constraint</text>
      <rect x="408" y="112" width="40" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="428" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">axiom</text>

      <!-- ===== L2 OWL 本体（结构层） ===== -->
      <rect x="80" y="200" width="800" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">OWL 本体</text>
      <text x="852" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">STRUCTURE · 结构层</text>
      <!-- chips -->
      <rect x="100" y="248" width="60" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="130" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">owl:Class</text>
      <rect x="172" y="248" width="88" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="216" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rdfs:subClassOf</text>
      <rect x="272" y="248" width="102" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="323" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">owl:ObjectProperty</text>
      <rect x="386" y="248" width="112" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="442" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">owl:DatatypeProperty</text>
      <rect x="510" y="248" width="98" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="559" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rdfs:domain / range</text>

      <!-- ===== L3 RDF 三元组（数据层） ===== -->
      <rect x="80" y="332" width="800" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">RDF 三元组</text>
      <text x="852" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">DATA · 数据层</text>
      <!-- chips -->
      <rect x="100" y="380" width="64" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="132" y="395" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">subject</text>
      <rect x="176" y="380" width="72" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="212" y="395" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">predicate</text>
      <rect x="260" y="380" width="60" height="24" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="290" y="395" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">object</text>
      <!-- 实例三元组（store 样式，强调具体事实） -->
      <rect x="336" y="380" width="182" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="427" y="395" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cont:ContractA cont:paymentDays 30</text>

      <!-- ===== L4 SHACL 形状（规则层，焦点） ===== -->
      <rect x="80" y="464" width="800" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="100" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">SHACL 形状</text>
      <text x="852" y="492" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">RULE · 规则层 · 必须怎样</text>
      <!-- chips -->
      <rect x="100" y="512" width="76" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="138" y="527" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sh:NodeShape</text>
      <rect x="188" y="512" width="88" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="232" y="527" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sh:targetClass</text>
      <rect x="288" y="512" width="72" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="324" y="527" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sh:property</text>
      <rect x="372" y="512" width="92" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="418" y="527" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sh:maxInclusive</text>
      <rect x="476" y="512" width="72" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="512" y="527" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sh:severity</text>
      <rect x="560" y="512" width="64" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="592" y="527" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sh:sparql</text>

      <!-- ===== 底部方向说明 ===== -->
      <text x="480" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ABSTRACT ↑ · 自下而上：具体的数据被规则约束，规则之上是表达它的本体，最上层是抽象的思维</text>

    </svg>
  </div>
</body>
</html>
