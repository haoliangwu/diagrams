<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本体价值与维护成本：转折点</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ONTOLOGY × RAG &nbsp;·&nbsp; DEBT CURVE</p>
    <h1>价值被成本追平的那一刻</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="debt-title debt-desc">
      <title id="debt-title">本体价值与维护成本的转折点</title>
      <desc id="debt-desc">示意曲线：随着时间推移，本体的价值（珊瑚色线）持续下滑，人工维护成本（灰绿色线）持续堆积，两条线在某一点追平；追平点在图中以垂直虚线标出，左侧为健康区（价值大于成本），右侧为债务区（每一分投入都在变成债务），止损线画在追平处。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 健康区 / 债务区背景 ===== -->
      <rect x="140" y="100" width="420" height="300" fill="rgba(124,143,111,0.06)"/>
      <rect x="560" y="100" width="280" height="300" fill="rgba(235,108,54,0.06)"/>

      <!-- ===== 止损线（交叉点垂直虚线） ===== -->
      <line x1="560" y1="96" x2="560" y2="404" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>
      <!-- 止损标签 -->
      <rect x="508" y="76" width="104" height="20" rx="4" fill="#f5f5f5"/>
      <text x="560" y="90" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">止损线 · 砍掉</text>

      <!-- ===== 区域标签 ===== -->
      <text x="280" y="420" fill="#7c8f6f" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">健康区 · 价值 &gt; 成本</text>
      <text x="700" y="420" fill="#eb6c36" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">债务区 · 每分投入都在变债</text>

      <!-- ===== 成本线（非焦点，series-1 灰绿，先画） ===== -->
      <polyline points="140,360 280,332 420,296 560,300 700,316 840,360"
                fill="none" stroke="#7c8f6f" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- ===== 价值线（焦点，accent 珊瑚橙） ===== -->
      <polyline points="140,120 280,168 420,220 560,300 700,380 840,400"
                fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- 焦点系列顶点圆点 -->
      <circle cx="140" cy="120" r="4" fill="#eb6c36"/>
      <circle cx="280" cy="168" r="4" fill="#eb6c36"/>
      <circle cx="420" cy="220" r="4" fill="#eb6c36"/>
      <circle cx="560" cy="300" r="4" fill="#eb6c36"/>
      <circle cx="700" cy="380" r="4" fill="#eb6c36"/>
      <circle cx="840" cy="400" r="4" fill="#eb6c36"/>

      <!-- ===== 线末端名称 ===== -->
      <text x="852" y="396" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">价值</text>
      <text x="852" y="352" fill="#7c8f6f" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">成本</text>

      <!-- ===== 交叉点标注 ===== -->
      <text x="560" y="452" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">价值被成本追平 → 止损点</text>

      <!-- ===== x 轴示意 ===== -->
      <line x1="140" y1="432" x2="840" y2="432" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="490" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">时间 · 规则变更累积 →</text>
      <text x="160" y="88" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">高</text>
      <text x="160" y="416" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">低</text>

      <!-- ===== 图例 + 说明 ===== -->
      <line x1="140" y1="516" x2="840" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <polyline points="164,532 180,532" fill="none" stroke="#eb6c36" stroke-width="1.8"/>
      <text x="192" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">本体价值</text>
      <polyline points="332,532 348,532" fill="none" stroke="#7c8f6f" stroke-width="1.2"/>
      <text x="360" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif">维护成本</text>
      <text x="480" y="536" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">示意图 · 表达趋势而非实测数据</text>

    </svg>
  </div>
</body>
</html>
